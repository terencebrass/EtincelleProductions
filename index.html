<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <title>L'étincelle Productions</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>

<!-- HEADER -->
<header>
    <img src="assets/cloud.png" class="header-cloud" alt="Nuage décoratif">

    <nav class="header-nav">
        <a href="index.html">
            <img src="assets/logo.png" class="nav-logo" alt="Home">
        </a>
        <a href="about.html">About Us</a>
        <a href="work.html">Work</a>
        <a href="social.html">Social</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>

<!-- HERO -->
<section class="hero">

    <div class="hero-illustration">
        <img src="assets/illustration.png" class="hero-illu" alt="Illustration">
        <img src="assets/logo.png" class="hero-logo" alt="Studio Logo">
    </div>

</section>


<script>
let scrollY = 0;
const speedBg = 0.8;   // fond
const speedPillars = 0.8;  // piliers

function updateParallax() {
    // On anime ici, pas dans l'événement scroll
    document.body.style.backgroundPosition = `
        left ${scrollY * speedPillars}px, 
        right ${scrollY * speedPillars}px, 
        0px ${scrollY * speedBg}px
    `;

    requestAnimationFrame(updateParallax);
}

window.addEventListener('scroll', () => {
    scrollY = window.scrollY;
});

// Démarrage de l’animation
updateParallax();
</script>


</body>
</html>
